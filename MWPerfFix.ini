; Settings are read at startup. Restart the game after editing.

[Fixes]
; Stops the shadow visibility check at the first hit. Same result, less work.
SweepEarlyExit = 1

; Reuses the shadow matrix within each model submission.
ReuseShadowMatrix = 1

; Uses the actual X, Y and Z shadow bounds instead of maximum X for all three.
; Changes visibility decisions and can increase or decrease shadow work.
CorrectShadowBounds = 1

; Checks the game's zero-effect threshold before doing costly transforms.
EarlyDepthThreshold = 1

[AdaptiveCarReflections]
; Updates all six reflection faces when there is room, or one per frame under load.
; Works with any enabled in-game reflection setting. Reflections off stay off.
Enabled = 0

; Target for adaptive decisions (this is not an FPS limiter!). Range: 30-1000.
TargetFPS = 60

[CarReflectionBlending]
; Dissolves old reflections into new ones in native mode 1 or adaptive single-face
; updates. Full updates bypass blending. Works without adaptive scheduling.
Enabled = 0

; Dissolve length: 2-6 steps. More steps can look smoother but add blur or ghosting.
; Other values use 2.
BlendSteps = 2

[LiveTuning]
; Enables in-game adjustments and brief messages. Changes last until restart.
; Enable the reflection features you want to tune above. Save chosen values here
; yourself. Keep Extra Options DoScreenPrintf off when using these messages.
Enabled = 0

; Uncomment the actions you want. No keys are bound by default.
; Use one Windows virtual-key number per action, in decimal or 0x-prefixed hex.
; Invalid or duplicate bindings are disabled. Examples below use F8 through F12.
; TargetFPS changes by 5. BlendSteps cycles from 2 through 6, then back to 2.
; ToggleAdaptive = 0x77
; TargetFPSDown = 0x78
; TargetFPSUp = 0x79
; ToggleBlending = 0x7A
; CycleBlendSteps = 0x7B

[Diagnostics]
; Records reflection timing through ETW in diagnostic builds only.
; Requires adaptive reflections enabled and a WPR capture. See README.md.
Enabled = 0
